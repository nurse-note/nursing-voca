<style>
/* Layout: sticky progress header on top, one focused study surface in the middle, fixed 4-tab bar at the bottom (phone-first, centered column on wide screens) */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --surface-2: #EAF0F5;
  --line: #D7E0E8;
  --ink: #14304A;
  --muted: #5A6C7D;
  --accent: #1F6FA8;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBF6;
  --known: #1B8A5A;
  --known-soft: #DDF3E8;
  --unsure: #B9780A;
  --unsure-soft: #FBEFD3;
  --unknown: #C23B35;
  --unknown-soft: #FBE1DF;
  --star: #D99A00;
  --shadow: 0 1px 2px rgba(20,48,74,.06), 0 6px 18px rgba(20,48,74,.07);
  --font-body: "Malgun Gothic", "맑은 고딕", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1620; --surface: #172230; --surface-2: #1F2D3D; --line: #2A3B4D;
    --ink: #E5EDF5; --muted: #94A7B9; --accent: #6DB2E8; --accent-ink: #0B1722; --accent-soft: #1C3347;
    --known: #4CC38A; --known-soft: #173A2B; --unsure: #E3AE4A; --unsure-soft: #3B2E14;
    --unknown: #EF7D77; --unknown-soft: #411F1F; --star: #F0B93A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1620; --surface: #172230; --surface-2: #1F2D3D; --line: #2A3B4D;
  --ink: #E5EDF5; --muted: #94A7B9; --accent: #6DB2E8; --accent-ink: #0B1722; --accent-soft: #1C3347;
  --known: #4CC38A; --known-soft: #173A2B; --unsure: #E3AE4A; --unsure-soft: #3B2E14;
  --unknown: #EF7D77; --unknown-soft: #411F1F; --star: #F0B93A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.wrap { max-width: 640px; margin: 0 auto; }

/* ---- header / overall progress ---- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.top-in { max-width: 640px; margin: 0 auto; }
.top-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { border: 0; background: transparent; padding: 4px 0; margin: -4px 0; font-weight: 700; font-size: 16px; letter-spacing: -.01em; text-align: left; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; min-width: 0; }
.pct { font-family: var(--font-mono); font-weight: 600; font-size: 15px; color: var(--known); font-variant-numeric: tabular-nums; }
.pbar { display: flex; height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin: 8px 0 6px; }
.pbar i { display: block; height: 100%; transition: width .35s ease; }
.pbar .k { background: var(--known); } .pbar .u { background: var(--unsure); } .pbar .x { background: var(--unknown); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend b { color: var(--ink); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.dot.k { background: var(--known); } .dot.u { background: var(--unsure); } .dot.x { background: var(--unknown); } .dot.n { background: var(--line); }

main { padding-block: 16px 104px; }
.view[hidden] { display: none; }

/* ---- shared controls ---- */
.bar-label { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; margin: 0 -2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-size: 13px; min-height: 36px; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip small { opacity: .75; margin-left: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 14px; font-size: 13px; min-height: 36px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
.opts label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; min-height: 48px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; min-height: 40px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.meter { height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin: 8px 0 14px; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.tag i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.star { border: 0; background: transparent; width: 44px; height: 44px; border-radius: 12px; display: inline-grid; place-items: center; color: var(--muted); flex: 0 0 auto; }
.star svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg { fill: currentColor; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }
.empty p { margin: 6px 0 0; font-size: 14px; }

/* ---- flash card ---- */
.scene { perspective: 1200px; margin-bottom: 14px; }
.card { display: grid; position: relative; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); }
.card[data-flipped="true"] { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 20px; min-height: 340px; display: flex; flex-direction: column; }
.face.back { transform: rotateY(180deg); }
.face .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.face .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; padding: 18px 0; }
.big-abbr { font-family: var(--font-mono); font-weight: 600; font-size: clamp(36px, 13vw, 58px); line-height: 1.1; letter-spacing: -.02em; overflow-wrap: anywhere; }
.big-text { font-size: clamp(22px, 7vw, 30px); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; word-break: keep-all; }
.big-origin { font-size: clamp(19px, 6vw, 25px); font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.hint { font-size: 12.5px; color: var(--muted); text-align: center; }
.back .abbr-s { font-family: var(--font-mono); font-weight: 600; font-size: 18px; color: var(--accent); }
.back .origin { font-size: 17px; font-weight: 500; margin: 10px 0 2px; overflow-wrap: anywhere; }
.back .pron { font-size: 13px; color: var(--muted); }
.back .mean { font-size: 24px; font-weight: 700; margin: 12px 0; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.35; }
.tip { background: var(--unsure-soft); border-radius: 12px; padding: 11px 13px; font-size: 14px; line-height: 1.55; }
.tip b { color: var(--unsure); font-size: 12px; letter-spacing: .04em; display: block; margin-bottom: 2px; }
.judge { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.judge .btn { padding: 12px 6px; font-size: 15px; }
.judge .k { background: var(--known-soft); color: var(--known); border-color: transparent; }
.judge .u { background: var(--unsure-soft); color: var(--unsure); border-color: transparent; }
.judge .x { background: var(--unknown-soft); color: var(--unknown); border-color: transparent; }
.judge-hint { text-align: center; font-size: 12.5px; color: var(--muted); margin: 0 0 8px; min-height: 18px; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px 18px; box-shadow: var(--shadow); text-align: center; }
.summary h2 { margin: 0 0 4px; font-size: 20px; }
.summary .score { font-family: var(--font-mono); font-size: 44px; font-weight: 600; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.stat3 div { border-radius: 12px; padding: 10px 4px; font-size: 13px; }
.stat3 b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat3 .k { background: var(--known-soft); color: var(--known); } .stat3 .u { background: var(--unsure-soft); color: var(--unsure); } .stat3 .x { background: var(--unknown-soft); color: var(--unknown); }
.actions { display: grid; gap: 8px; margin-top: 8px; }
.wrong-list { text-align: left; margin: 14px 0 6px; display: grid; gap: 8px; }
.wrong-list .w { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); }
.wrong-list .w .a { font-family: var(--font-mono); font-weight: 600; color: var(--unknown); }
.wrong-list .w .m { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

/* ---- quiz ---- */
.q-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 12px; }
.q-kind { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 10px; margin-bottom: 12px; }
.q-prompt { text-align: center; padding: 8px 0 4px; }
.choices { display: grid; gap: 10px; margin-bottom: 12px; }
.choice { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; min-height: 58px; }
.choice .n { font-family: var(--font-mono); font-size: 13px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); margin-top: 1px; }
.choice .l1 { font-weight: 600; overflow-wrap: anywhere; word-break: keep-all; }
.choice .l2 { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin-top: 1px; }
.choice .l2.mono, .choice .l1.mono { font-family: var(--font-mono); }
.choice.right { border-color: var(--known); background: var(--known-soft); }
.choice.right .n { background: var(--known); color: var(--surface); }
.choice.wrong { border-color: var(--unknown); background: var(--unknown-soft); }
.choice.wrong .n { background: var(--unknown); color: var(--surface); }
.choice:disabled { opacity: 1; cursor: default; }
.choice.dim { opacity: .55; }
.feedback { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.feedback .verdict { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
.feedback .verdict.ok { color: var(--known); } .feedback .verdict.no { color: var(--unknown); }
.feedback .full { font-size: 14px; margin: 4px 0 10px; overflow-wrap: anywhere; }
.feedback .full .a { font-family: var(--font-mono); font-weight: 600; color: var(--accent); }

/* ---- dictation ---- */
.dict-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 20px 18px; margin-bottom: 12px; }
.dict-card .mid { text-align: center; padding: 16px 0 8px; }
.hint-line { min-height: 24px; text-align: center; color: var(--muted); font-size: 14px; margin-top: 4px; }
.field { display: flex; gap: 8px; margin-bottom: 8px; }
.field input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.field input:disabled { background: var(--surface-2); }
.field.ok input { border-color: var(--known); } .field.no input { border-color: var(--unknown); }
.dict-actions { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 12px; }
.note { font-size: 13px; color: var(--muted); }

/* ---- list ---- */
.search { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); margin-bottom: 10px; }
.sel { font: inherit; font-size: 14px; padding: 8px 10px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.group-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); margin: 18px 2px 8px; }
.group-h i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
.item-main { display: flex; align-items: center; gap: 2px; padding-right: 10px; }
.item-btn { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(68px, 30%) 1fr auto; gap: 10px; align-items: center; text-align: left; border: 0; background: transparent; padding: 10px 4px 10px 0; min-height: 56px; }
.item-btn .a { font-family: var(--font-mono); font-weight: 600; font-size: 15px; overflow-wrap: anywhere; color: var(--accent); }
.item-btn .m { font-size: 14px; overflow-wrap: anywhere; word-break: keep-all; }
.item-more { padding: 0 14px 14px 14px; border-top: 1px dashed var(--line); }
.item-more .origin { font-weight: 500; margin: 10px 0 0; overflow-wrap: anywhere; }
.item-more .pron { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.stat-line { font-size: 12.5px; color: var(--muted); margin: 8px 0; font-variant-numeric: tabular-nums; }
.setst { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.setst button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; min-height: 32px; }
.setst button[aria-pressed="true"].k { background: var(--known-soft); color: var(--known); border-color: var(--known); }
.setst button[aria-pressed="true"].u { background: var(--unsure-soft); color: var(--unsure); border-color: var(--unsure); }
.setst button[aria-pressed="true"].x { background: var(--unknown-soft); color: var(--unknown); border-color: var(--unknown); }
.setst button[aria-pressed="true"].n { background: var(--surface-2); border-color: var(--muted); }
.reset-zone { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rules { font-size: 12.5px; color: var(--muted); margin: 18px 0 0; }
.rules summary { cursor: pointer; padding: 6px 0; }
.rules ul { margin: 4px 0 0; padding-left: 18px; }
.rules li { margin-bottom: 3px; }
.warn { font-size: 12.5px; color: var(--unsure); margin-bottom: 8px; }

/* ---- bottom tabs ---- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { border: 0; background: transparent; border-radius: 12px; display: grid; justify-items: center; gap: 2px; padding: 7px 2px 6px; min-height: 54px; color: var(--muted); font-size: 12px; font-weight: 500; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 700; }

.tabs-in { grid-template-columns: repeat(6, 1fr); gap: 2px; }
.tab { font-size: 11px; padding: 7px 0 6px; letter-spacing: -.02em; }
.sec-h { font-size: 17px; margin: 0 0 8px; }
.deck { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.deck.cur { border-color: var(--accent); }
.deck .pbar { margin: 10px 0 8px; }
.deck-name { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
.badge { font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.deck-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.deck-actions .btn { padding: 10px 8px; font-size: 14px; }
.ex-deck { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 4px; margin-bottom: 10px; }
.ex-deck .chips { padding-top: 8px; flex-wrap: wrap; overflow: visible; }
.ex-foot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.pk { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 6px; min-height: 48px; cursor: pointer; }
.pk input { width: 22px; height: 22px; flex: 0 0 auto; accent-color: var(--accent); }
.pk .a { font-family: var(--font-mono); font-weight: 600; font-size: 14px; color: var(--accent); flex: 0 0 34%; overflow-wrap: anywhere; }
.pk .m { flex: 1; font-size: 14px; overflow-wrap: anywhere; word-break: keep-all; min-width: 0; }
.pk .dk { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
.say { border: 0; background: var(--accent-soft); color: var(--accent); width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center; flex: 0 0 auto; vertical-align: middle; margin-left: 4px; }
.say svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.say-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.say-row > span { min-width: 0; overflow-wrap: anywhere; }
.item.playing { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset; }
.pl-set { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 4px; margin: 6px 0 10px; }
.pl-set .opts { margin-bottom: 8px; }
.player { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 24; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(20,48,74,.08); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.player-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.pl-now { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player.on .pl-now { color: var(--ink); font-weight: 600; }
.pl-s { min-width: 44px; min-height: 44px; padding: 6px; font-size: 15px; }

<script>

t blood test","p":"피컬 오컬트 블러드 테스트","m":"대변잠혈검사","t":"fecal(대변의)+occult(숨은)+blood test(혈액검사) → 대변 속 잠혈을 확인하는 검사","c":3},{"id":21,"a":"BS","o":"breath sound","p":"브레스 사운드","m":"호흡음","t":"breath(호흡)+sound(소리) → 청진기로 듣는 호흡음","c":4},{"id":37,"a":"CPAP","o":"continuous positive airway pressure","p":"컨티뉴어스 파지티브 에어웨이 프레셔","m":"지속적 기도양압","t":"continuous(지속적인)+positive airway pressure(기도양압) → 수면무호흡증 치료기기","c":4},{"id":40,"a":"CPT","o":"chest physiotherapy","p":"체스트 피지오세러피","m":"흉부 물리요법","t":"chest(흉부)+physiotherapy(물리요법) → 가래 배출을 돕는 흉부타진법","c":4},{"id":49,"a":"DPI","o":"dry powder inhaler","p":"드라이 파우더 인헤일러","m":"건조분말 흡입기","t":"dry powder(건조 분말)+inhaler(흡입기) → MDI(정량식)와 다른 분말형 흡입기","c":4},{"id":67,"a":"ERV","o":"expiratory reserve volume","p":"익스파이러토리 리저브 볼륨","m":"호기보유용적","t":"expiratory(호기의)+reserve(예비)+volume(용적) → 평소 날숨 후 더 내쉴 수 있는 여유량","c":4},{"id":99,"a":"IRV","o":"inspiratory reserve volume","p":"인스파이러토리 리저브 볼륨","m":"흡기보유용적","t":"ERV의 반대: inspiratory(흡기의) → 평소 들숨 후 더 들이쉴 수 있는 여유량","c":4},{"id":94,"a":"IC","o":"inspiratory capacity","p":"인스파이러토리 캐패시티","m":"흡기용량","t":"inspiratory(흡기의)+capacity(용량) → 최대로 들이마실 수 있는 공기량","c":4},{"id":75,"a":"FRC","o":"functional residual capacity","p":"펑셔널 레지듀얼 캐패시티","m":"기능적 잔기량","t":"functional(기능적인)+residual(남은)+capacity(용량) → 평소 호흡 후 폐에 남아있는 공기량","c":4},{"id":72,"a":"FEV1","o":"forced expiratory volume at one second","p":"포스드 익스파이러토리 볼륨 앳 원 세컨드","m":"일초간 노력성 호기량","t":"forced expiratory volume(노력성 호기량)에 '1초'가 붙음 → 1초간 최대로 내쉬는 공기량","c":4},{"id":77,"a":"FVC","o":"forced vital capacity","p":"포스드 바이탈 캐패시티","m":"노력성 호기 폐활량","t":"forced(노력성의)+vital capacity(폐활량) → 최대한 힘껏 내쉰 폐활량","c":4},{"id":73,"a":"Fio2","o":"fraction of inspired oxygen","p":"프랙션 오브 인스파이어드 옥시전","m":"흡입 산소농도","t":"fraction(비율)+inspired oxygen(흡입된 산소) → 들이마시는 공기 중 산소 비율","c":4},{"id":69,"a":"ETCO2","o":"end tidal Co2 monitoring","p":"엔드 타이달 씨오투 모니터링","m":"호기말 이산화탄소 농도 검사","t":"end tidal(호기말)+CO2 monitoring → 날숨 끝부분의 이산화탄소 농도 측정","c":4},{"id":36,"a":"COPD","o":"chronic obstructive pulmonary disease","p":"크로닉 옵스트럭티브 펄모너리 디지즈","m":"만성폐쇄성 폐질환","t":"chronic(만성)+obstructive(폐쇄성)+pulmonary disease(폐질환) → 흡연 관련 대표 만성폐질환","c":4},{"id":31,"a":"CI","o":"cardiac index","p":"카디악 인덱스","m":"심장박출지수","t":"cardiac(심장의)+index(지수) → CO(심박출량)를 체표면적으로 보정한 지수 ※ 원본 PDF에서는 Cl(소문자 l)처럼 보이지만 cardiac index의 CI예요.","c":5},{"id":35,"a":"CO","o":"cardiac output","p":"카디악 아웃풋","m":"심장박출량","t":"cardiac(심장의)+output(출력) → 심장이 1분간 내보내는 혈액량","c":5},{"id":39,"a":"CPR","o":"cardiopulmonary resuscitation","p":"카디오펄모너리 리서시테이션","m":"심폐소생술","t":"cardio(심장)+pulmonary(폐)+resuscitation(소생) → 이미 익숙한 CPR","c":5},{"id":44,"a":"CVA","o":"Cerebro-Vascular-Accident","p":"세레브로 배스큘러 액시던트","m":"뇌혈관 손상, 뇌졸중","t":"cerebro(뇌)+vascular(혈관)+accident(사고) → 뇌혈관 사고=뇌졸중","c":5},{"id":26,"a":"Cal","o":"Calorie, calory","p":"칼로리","m":"칼로리","t":"Calorie의 앞 3글자, 에너지 단위로 익숙한 단어","c":6,"sp":1},{"id":52,"a":"DRIs","o":"dietary reference intakes","p":"다이어터리 레퍼런스 인테이크스","m":"일일섭취기준","t":"dietary(식이의)+reference intakes(참고 섭취량) → 하루 권장 영양섭취기준","c":6},{"id":53,"a":"DW","o":"dextrose in water","p":"덱스트로스 인 워터","m":"포도당액","t":"dextrose(포도당)+in water(물에) → 수액으로 놓는 포도당 용액","c":6},{"id":57,"a":"ECF","o":"extra cellular fluid","p":"엑스트라 셀룰러 플루이드","m":"세포외액","t":"extra(밖의)+cellular(세포의)+fluid(체액) → 세포 밖에 있는 체액","c":6},{"id":78,"a":"FVD","o":"fluid volume deficit","p":"플루이드 볼륨 데피시트","m":"체액부족","t":"fluid volume(체액량)+deficit(부족) → 탈수 등으로 체액이 부족한 상태","c":6},{"id":79,"a":"FVE","o":"fluid volume excess","p":"플루이드 볼륨 엑세스","m":"체액과다","t":"FVD의 반대: excess(과다) → 체액이 과다하게 축적된 상태(부종 등)","c":6},{"id":29,"a":"CBE","o":"charting by exception","p":"차팅 바이 익셉션","m":"특기사항기록","t":"charting(기록)+by exception(예외로) → 정상범위는 생략하고 특이사항만 기록","c":7},{"id":30,"a":"CC","o":"Chief Complaint","p":"치프 컴플레인트","m":"주호소","t":"Chief(주된)+Complaint(불편감) → 환자가 가장 먼저 호소하는 증상","c":7},{"id":51,"a":"DRG","o":"diagnosis-related groups","p":"다이어그노시스 릴레이티드 그룹스","m":"포괄수가제","t":"diagnosis(진단)+related groups(관련 그룹) → 진단명에 따라 정액수가로 묶어 청구하는 제도","c":7},{"id":54,"a":"Dx","o":"diagnosis","p":"다이어그노시스","m":"진단/진단명","t":"Sx(증상)-Dx(진단)-Tx(치료) 세트로 함께 암기(진단은 x로 줄이는 패턴)","c":7},{"id":91,"a":"Hx","o":"history","p":"히스토리","m":"병력","t":"PH(past history, 과거력)와 연결지어서 history의 h+x로 줄인 것을 기억","c":7},{"id":32,"a":"CIS","o":"clinical information system","p":"클리니컬 인포메이션 시스템","m":"임상정보체계","t":"clinical(임상의)+information system(정보시스템) → 병원 임상 데이터 전산망","c":8},{"id":38,"a":"CPOE","o":"computerized provider order entry","p":"컴퓨터라이즈드 프로바이더 오더 엔트리","m":"컴퓨터처방기입","t":"computerized(전산화된)+provider order entry(처방입력) → 의사가 컴퓨터로 직접 처방입력","c":8},{"id":62,"a":"EID","o":"electronic infusion device","p":"일렉트로닉 인퓨전 디바이스","m":"전기주입기구","t":"electronic(전자의)+infusion device(주입기구) → 수액 주입속도를 자동조절하는 펌프","c":8},{"id":63,"a":"EMR","o":"electronic medical record","p":"일렉트로닉 메디컬 레코드","m":"전자의무기록","t":"electronic(전자의)+medical record(의무기록) → 종이차트 대신 전자로 기록","c":8},{"id":87,"a":"HIS","o":"health care information system","p":"헬스케어 인포메이션 시스템","m":"건강관리정보체계","t":"health care(의료)+information system(정보시스템) → 병원 전체 운영 정보시스템","c":8},{"id":13,"a":"APN","o":"Advanced Practice Nurse","p":"어드밴스드 프랙티스 널스","m":"전문간호사","t":"Advanced(진전된)+Practice Nurse(임상간호사) → 한 단계 더 전문성을 갖춘 간호사","c":9},{"id":22,"a":"BSN","o":"Bachelor of Science in Nursing","p":"배철러 오브 사이언스 인 널싱","m":"간호학사 학위","t":"Bachelor(학사)+Science in Nursing(간호학) → 4년제 간호학사 학위","c":9},{"id":33,"a":"CNS","o":"clinical nurse specialist","p":"클리니컬 널스 스페셜리스트","m":"임상전문간호사","t":"clinical(임상의)+nurse specialist(전문간호사) → 같은 약자 CNS(중추신경계)와 문맥으로 구분!","c":9},{"id":50,"a":"Dr","o":"doctor","p":"닥터","m":"의사","t":"doctor의 앞 2글자, 가장 흔한 줄임말","c":9},{"id":56,"a":"EBP","o":"evidence based practice","p":"에비던스 베이스드 프랙티스","m":"근거기반실무","t":"evidence(근거)+based(기반한)+practice(실무) → 연구근거에 기반한 간호실무","c":9},{"id":95,"a":"ICN","o":"International Council of Nurses","p":"인터내셔널 카운슬 오브 널시스","m":"국제간호협의회","t":"International(국제)+Council of Nurses(간호사협의회) → KNA(한국)의 국제 버전","c":9},{"id":42,"a":"CSR","o":"Central Supply Room","p":"센트럴 서플라이 룸","m":"중앙공급실","t":"Central(중앙)+Supply Room(공급실) → 소독물품 등을 모아 공급하는 부서","c":10},{"id":55,"a":"E.N.T","o":"ear, nose and throat","p":"이어, 노즈 앤 스로트","m":"이비인후과","t":"ear(귀)+nose(코)+throat(목) → 귀·코·목을 보는 진료과","c":10},{"id":81,"a":"GI","o":"gastro-intestine","p":"가스트로 인테스틴","m":"위장계","t":"gastro(위)+intestine(장) → 위와 장을 합친 소화기계","c":10},{"id":83,"a":"GU","o":"genito-urinary","p":"제니토 유리너리","m":"비뇨생식기","t":"genito(생식기)+urinary(비뇨기) → 비뇨생식기계 진료","c":10},{"id":84,"a":"Gyn","o":"gynecology","p":"가이네콜로지","m":"부인과","t":"gynecology 앞 3글자, 여성 생식기를 다루는 진료과","c":10},{"id":34,"a":"CNS","o":"Central Nervous System","p":"센트럴 너버스 시스템","m":"중추신경계","t":"Central(중추의)+Nervous System(신경계) → 뇌와 척수, 같은 약자 CNS(전문간호사)와 구분주의!","c":11},{"id":41,"a":"CSF","o":"Cerebro Spinal Fluid","p":"세레브로 스파이널 플루이드","m":"뇌척수액","t":"Cerebro(뇌)+Spinal(척수)+Fluid(액체) → 뇌와 척수를 보호하는 액체","c":11},{"id":80,"a":"G-B syndrome","o":"Guillain-Barre syndrome","p":"길랑-바레 신드롬","m":"길랑-바레 증후군","t":"발견자 두 사람 이름(Guillain, Barré)을 딴 자가면역성 신경질환 ※ 원본 표기는 Guilain-Barre지만 바른 철자는 Guillain-Barré예요.","c":11,"alt":["Guilain-Barre syndrome"]},{"id":88,"a":"HIV","o":"human immunodeficiency virus","p":"휴먼 이뮤노데피션시 바이러스","m":"인간면역결핍 바이러스","t":"human(인간)+immunodeficiency(면역결핍)+virus(바이러스) → 에이즈를 일으키는 바이러스","c":11},{"id":3,"a":"aa","o":"ana","p":"아나","m":"각각","t":"라틴어 ana=각각(같은 양씩) → 처방전에서 여러 약을 '각각' 섞을 때 사용","c":12},{"id":7,"a":"ac","o":"ante cibum, before meal","p":"안테 시붐","m":"식전","t":"ante(이전)+cibum(식사) → pc(식후)의 반대말로 세트 암기","c":12,"sp":1},{"id":11,"a":"amp","o":"ampule","p":"앰플","m":"앰플","t":"ampule의 줄임, 밀봉된 유리용기 약병","c":12},{"id":16,"a":"bid","o":"bis in die, twice a day","p":"비스 인 디에","m":"하루 두 번","t":"bis=2번(bicycle의 bi와 연결) → 하루 2번 투여","c":12,"sp":1},{"id":17,"a":"bin","o":"bis in nocte","p":"비스 인 녹테","m":"하루 밤에 두 번","t":"bid와 비슷하지만 nocte(밤)가 붙어 '밤에' 2번이라는 뜻","c":12},{"id":25,"a":"c(c)̄","o":"com(with) / cum","p":"쿰, 콤","m":"함께, 같이","t":"라틴어 cum=with, S(s)(without, 없이)의 반대말로 세트 암기","c":12,"sp":1},{"id":27,"a":"cap","o":"capsule","p":"캡슐","m":"교갑","t":"capsule의 줄임말, 발음 그대로 '캡'","c":12},{"id":82,"a":"gtt","o":"gutta(drop)","p":"구타","m":"방울","t":"라틴어 gutta=물방울, 수액 방울수를 셀 때 사용하는 단위","c":12},{"id":89,"a":"hs","o":"hora somni, at bedtime","p":"호라 솜니","m":"취침시간","t":"hora(시간)+somni(잠) → '잠자는 시간'에 투여","c":12,"sp":1},{"id":96,"a":"IM","o":"intramuscular","p":"인트라머스큘러","m":"근육내","t":"intra(안으로)+muscular(근육의) → 근육주사, sc(피하)보다 깊게 주사","c":12},{"id":97,"a":"inf","o":"infusion","p":"인퓨전","m":"주입","t":"infusion의 줄임, 수액 등을 '주입'한다는 뜻","c":12},{"id":100,"a":"IV","o":"intravenous","p":"인트라비너스","m":"정맥내","t":"intra(안으로)+venous(정맥의) → 정맥주사, IM(근육내)과 세트로 비교암기","c":12},{"id":6,"a":"ABR","o":"absolute bed rest","p":"앱솔루트 베드 레스트","m":"절대안정","t":"absolute(절대적인)+bed rest(침상안정) → 움직임을 완전히 제한하는 안정","c":13},{"id":10,"a":"AMA","o":"against medical advice","p":"어게인스트 메디컬 어드바이스","m":"의학적 권고거부","t":"against(반하여)+medical advice(의학적 조언) → 의사 권고를 거부함","c":13},{"id":46,"a":"DAMA","o":"discharge against medical advice","p":"디스차지 어게인스트 메디컬 어드바이스","m":"자의퇴원","t":"discharge(퇴원)+AMA(의학적 권고거부) → AMA 앞에 discharge가 붙은 확장형","c":13},{"id":47,"a":"DC","o":"discontinue","p":"디스컨티뉴","m":"중단, 중지","t":"discontinue의 앞 2글자, 투약이나 처치를 '중단'한다는 뜻","c":13},{"id":48,"a":"DOA","o":"dead on arrival","p":"데드 온 어라이벌","m":"도착시 사망","t":"dead(사망한)+on arrival(도착 시) → 병원 도착 당시 이미 사망한 상태","c":13},{"id":59,"a":"EDS","o":"excessive daytime sleepiness","p":"엑세시브 데이타임 슬리피니스","m":"과도주간졸음","t":"excessive(과도한)+daytime(주간)+sleepiness(졸림) → 낮 동안 비정상적으로 졸린 증상","c":14},{"id":71,"a":"F","o":"female","p":"피메일","m":"여성","t":"female의 첫 글자, M(male, 남성)과 짝을 이룸","c":14},{"id":85,"a":"h","o":"hour","p":"아워","m":"시간","t":"hour의 첫 글자, q h(매시간)처럼 다른 약어와 자주 결합되어 사용","c":14},{"id":9,"a":"ADH","o":"antidiuretic hormone","p":"안티다이유레틱 호르몬","m":"항이뇨호르몬","t":"anti(반대)+diuretic(이뇨의)+hormone(호르몬) → 소변량을 줄이는(이뇨를 막는) 호르몬","c":15},{"id":45,"a":"D&C","o":"dilatation and curettage","p":"딜레이테이션 앤 큐레타지","m":"소파술","t":"dilatation(확장)+curettage(긁어냄) → 자궁경부를 넓히고 내막을 긁어내는 시술","c":16},{"id":92,"a":"I&D","o":"incision and drainage","p":"인시전 앤 드레이니지","m":"절개와 배액","t":"incision(절개)+drainage(배액) → 고름 등을 빼내기 위해 절개 후 배액","c":16},{"id":65,"a":"epith","o":"epithelium","p":"에피시리엄","m":"상피","t":"epithelium의 줄임말, 몸의 표면을 덮는 '상피'조직","c":17}]},{"id":"fund2","name":"기본간호학2 단어장","short":"기본간호학2","sub":"2학기 101~217번","cats":["검사·영상 검사","간호 조직·분류체계·기록","신체 부위·방향","활력징후·신체계측","투약 경로·영양 공급","투약 빈도 (라틴어 기원)","제형·용량 표현","처방·지시 체계","수면 관련","수술·처치·재활","검사결과·질환·상태","시간·빈도 표현","일반·행정"],"words":[{"id":101,"a":"IVP","o":"intravenous pyelography","p":"인트라비너스 파이엘로그라피","m":"정맥내 신우촬영술","t":"intra(안으로)+venous(정맥)+pyelo(신우)+graphy(촬영) → 정맥으로 조영제를 넣어 신우를 찍는 검사","c":0},{"id":102,"a":"K.U.B.","o":"Kidney, Ureter, Bladder","p":"키드니, 유리터, 블래더","m":"신장, 수뇨관, 방광","t":"비뇨기 3총사 영문 앞글자 그대로 콩팥(K)-요관(U)-방광(B) 순서로 암기","c":0},{"id":114,"a":"MRI","o":"Magnetic Resonance Imaging","p":"매그네틱 레저넌스 이미징","m":"자기공명영상","t":"이미 익숙한 단어: 자석(Magnetic)으로 공명(Resonance)시켜 영상(Imaging)을 찍는다","c":0},{"id":141,"a":"PFT","o":"pulmonary function test","p":"펄모너리 펑션 테스트","m":"폐기능 검사","t":"pulmonary=폐, function=기능 → '폐 기능 테스트' 그대로 직역","c":0},{"id":137,"a":"PEFR","o":"peak expiratory flow rate","p":"피크 엑스파이러토리 플로우 레이트","m":"최대 호기유속 검사","t":"peak(최고)+expiratory(내쉬는)+flow rate(속도) → 숨을 최대로 내쉴 때의 속도","c":0},{"id":212,"a":"VAS","o":"Visual Analogue Scale","p":"비주얼 애널로그 스케일","m":"시각사상척도","t":"통증사정 0~10 눈금자: Visual(시각적)+Scale(척도)로 통증강도 표시 ※ 원본 뜻은 시각사상척도로 적혀 있지만 보통 시각상사척도(시각통증척도)라고 불러요.","c":0},{"id":187,"a":"sp.gr","o":"specific gravity","p":"스페시픽 그래비티","m":"비중","t":"specific(특정한)+gravity(무게) → 소변 등 액체의 상대적 무게=비중","c":0},{"id":188,"a":"spec","o":"specimen","p":"스페서먼","m":"검사물","t":"specimen 앞 4글자만 딴 것, '스펙(spec) 검사물 제출'로 연상","c":0},{"id":190,"a":"SST","o":"serum separation tube","p":"시럼 세퍼레이션 튜브","m":"혈청분리튜브","t":"serum(혈청)을 separation(분리)하는 tube(튜브), 채혈관 중 하나","c":0},{"id":104,"a":"Lab","o":"laboratory","p":"래버러토리","m":"실험실","t":"laboratory의 앞 3글자, '랩실'이라는 우리말과 그대로 연결","c":1},{"id":103,"a":"KNA","o":"Korean Nurses Association","p":"코리안 널시스 어소시에이션","m":"대한간호협회","t":"Korean+Nurses+Association 앞글자 그대로 '한국 간호사 협회'","c":1},{"id":115,"a":"NANDA","o":"North American Nursing Diagnosis Association","p":"노스 아메리칸 널싱 다이어그노시스 어소시에이션","m":"북미간호진단협의회","t":"간호진단(Diagnosis) 대표기구 → '난다(NANDA)하고 진단명이 정해진다'로 연상","c":1},{"id":117,"a":"NIC","o":"nursing intervention classification","p":"널싱 인터벤션 클래시피케이션","m":"간호중재분류체계","t":"N-I-C = Nursing Intervention Classification, I=중재(Intervention)만 기억","c":1},{"id":120,"a":"NOC","o":"nursing outcome classification","p":"널싱 아웃컴 클래시피케이션","m":"간호결과분류체계","t":"NIC의 짝꿍, O=Outcome(결과)만 다르다고 기억 (중재NIC → 결과NOC)","c":1},{"id":118,"a":"NIS","o":"nursing information system","p":"널싱 인포메이션 시스템","m":"간호정보시스템","t":"Information=정보 → 간호 '정보'시스템, 전산 관련 용어","c":1},{"id":149,"a":"POMR","o":"problem-oriented medical record","p":"프라블럼 오리엔티드 메디컬 레코드","m":"문제중심의무기록","t":"Problem(문제)+Oriented(중심의)+Medical Record(의무기록) 그대로 결합","c":1},{"id":175,"a":"RN","o":"Registered Nurse","p":"레지스터드 널스","m":"등록(면허)간호사","t":"Register=등록하다 → 국가에 정식 등록된 간호사(면허간호사)","c":1},{"id":161,"a":"QA","o":"quality assurance","p":"퀄리티 어슈어런스","m":"질 보장","t":"Quality(질)+Assurance(보장), 최소 기준을 '보장'한다는 의미","c":1},{"id":163,"a":"QI","o":"quality improvement","p":"퀄리티 임프루브먼트","m":"질 향상","t":"QA(질 보장)의 다음 단계, Improvement=향상 → 한 단계 더 나아지는 것","c":1},{"id":106,"a":"LLQ","o":"left lower quadrant","p":"레프트 로어 쿼드런트","m":"좌측 하부 4분의 1","t":"복부를 4등분: L/R(좌우)+U/L(상하)+Q(4분의1) 조합만 바꿔서 4개 모두 암기","c":2},{"id":107,"a":"LUQ","o":"left upper quadrant","p":"레프트 어퍼 쿼드런트","m":"좌측 상부 4분의 1","t":"LLQ와 세트: Upper=상부, Lower=하부만 구분하면 됨","c":2},{"id":174,"a":"RLQ","o":"right lower quadrant","p":"라이트 로어 쿼드런트","m":"우측 하부 4분의 1","t":"L(왼쪽)을 R(오른쪽)로만 바꾸면 됨, 충수돌기염 통증부위로 유명","c":2},{"id":178,"a":"RUQ","o":"right upper quadrant","p":"라이트 어퍼 쿼드런트","m":"우측 상부 4분의 1","t":"간(liver)이 위치한 부위로 기억하면 오래 남음","c":2},{"id":169,"a":"R","o":"rectum","p":"렉텀","m":"직장","t":"Rectum의 첫 글자 R, '직장(Rectum)의 R'로 단순암기","c":2},{"id":177,"a":"Rt","o":"right","p":"라이트","m":"우측","t":"right의 앞 2글자를 딴 것, Lt(left)와 짝을 이룸","c":2},{"id":127,"a":"OD","o":"oculus dexter, right eye","p":"오큘루스 덱스터","m":"우측 눈","t":"dexter는 '오른쪽'이라는 뜻 → dexterity(손재주, 오른손잡이) 연상","c":2,"sp":1},{"id":130,"a":"OS","o":"oculus sinister, left eye","p":"오큘루스 시니스터","m":"좌측 눈","t":"sinister는 '왼쪽, 불길한'이라는 뜻 → 옛날 왼손을 불길하게 여긴 것과 연결","c":2,"sp":1},{"id":133,"a":"OU","o":"oculus uterque, both eyes","p":"오큘루스 우테르퀘","m":"양측 눈","t":"U=uterque(둘 다) → OU의 U를 '둘 다(Uterque)'로 기억","c":2,"sp":1},{"id":211,"a":"vag","o":"vagina","p":"바지이나","m":"질","t":"vagina의 앞 3글자를 그대로 줄인 것","c":2},{"id":195,"a":"T P R","o":"Temperature, Pulse, Respiration","p":"템퍼러처, 펄스, 레스퍼레이션","m":"체온, 맥박, 호흡","t":"체온-맥박-호흡, 기본 3대 활력징후를 순서 그대로 나열한 것 ※ 원본에는 Purse로 오타가 있어 Pulse(맥박)로 바로잡았어요.","c":3},{"id":209,"a":"V/S","o":"Vital Sign","p":"바이탈 사인","m":"활력징후","t":"Vital(생명의)+Sign(징후) → 생명과 직결된 신호, TPR+혈압을 포함","c":3},{"id":109,"a":"MAC","o":"mid arm circumference","p":"미드 암 서컴퍼런스","m":"중간 상박부 둘레","t":"mid(중간)+arm(팔)+circumference(둘레) → 팔 중간 둘레 측정","c":3},{"id":202,"a":"TSF","o":"triceps skin fold","p":"트라이셉스 스킨 폴드","m":"삼두박근 피부 주름 두께","t":"triceps(삼두근)+skin fold(피부주름) → 영양상태 사정 지표","c":3},{"id":179,"a":"RV","o":"residual volume","p":"레지듀얼 볼륨","m":"잔기량","t":"residual=남은 것 → 숨을 다 내쉬어도 폐에 '남는' 공기량","c":3},{"id":203,"a":"TV","o":"tidal volume","p":"타이달 볼륨","m":"일회호흡용적","t":"tidal=밀물썰물처럼 드나드는 → 한 번 들숨날숨에 오가는 공기량","c":3},{"id":213,"a":"VC","o":"vital capacity","p":"바이탈 캐패시티","m":"폐활량","t":"vital(생명의)+capacity(용량) → 폐가 담을 수 있는 최대 공기량","c":3},{"id":199,"a":"TLC","o":"total lung capacity","p":"토탈 렁 캐패시티","m":"총폐용량","t":"total(총)+lung(폐)+capacity(용량), VC보다 더 큰 개념(잔기량까지 포함)","c":3},{"id":192,"a":"SV","o":"stroke volume","p":"스트로크 볼륨","m":"일회박출량","t":"stroke=심장이 한 번 뛰는 박동 → 한 번 박동에 나가는 혈액량","c":3},{"id":208,"a":"V","o":"volume","p":"볼륨","m":"양","t":"volume의 앞글자, 부피·용량을 뜻하는 가장 기본 단어","c":3},{"id":217,"a":"Wt","o":"weight","p":"웨이트","m":"중량, 체중","t":"weight의 W+t만 딴 것, 발음 그대로 '웨이트'","c":3},{"id":105,"a":"Lb","o":"pound","p":"파운드","m":"파운드","t":"라틴어 libra의 약자, 무게 단위 파운드를 lb로 표기하는 것을 그대로 암기","c":3},{"id":134,"a":"oz","o":"ounce","p":"온스","m":"온스","t":"무게 단위 온스의 줄임말, 발음이 표기와 비슷해 암기 쉬움","c":3},{"id":155,"a":"pt","o":"pint","p":"파인트","m":"파인트","t":"부피 단위(약 0.47L), pint의 앞 2글자","c":3},{"id":166,"a":"qt","o":"quart","p":"콰트","m":"콰트","t":"quarter(4분의1)에서 유래, 1갤런의 4분의 1 부피","c":3},{"id":147,"a":"po","o":"per os, by mouth","p":"퍼 오스","m":"경구로","t":"os=입(라틴어) → '입으로(경구)' 투여한다는 뜻","c":4,"sp":1},{"id":181,"a":"sc","o":"sub cutis, subcutaneously","p":"서브큐테이니어슬리","m":"피하","t":"sub(아래)+cutis(피부) → 피부 아래(피하주사)에 놓는다","c":4,"sp":1},{"id":122,"a":"NPO","o":"non per os, nothing by mouth","p":"논 퍼 오스","m":"금식","t":"non+per os = '입으로 아무것도 안 됨' → 금식(NPO)","c":4,"sp":1},{"id":111,"a":"MDI","o":"metered-dose inhaler","p":"미터드 도즈 인헤일러","m":"정량식 흡입기","t":"metered(계량된)+dose(용량)+inhaler(흡입기) → 천식환자가 쓰는 흡입기","c":4},{"id":132,"a":"OTC","o":"over-the-counter drug","p":"오버 더 카운터","m":"비처방약","t":"계산대(counter) 너머로 바로 살 수 있는 약 → 처방전 없이 사는 약","c":4},{"id":146,"a":"PN","o":"parenteral nutrition","p":"퍼렌터럴 뉴트리션","m":"비경구 영양, 정맥영양","t":"para(옆)+enteral(장) → 장을 거치지 않는 영양공급(정맥으로)","c":4},{"id":200,"a":"TPN","o":"total parenteral nutrition","p":"토탈 퍼렌터럴 뉴트리션","m":"총비경구영양","t":"PN 앞에 total(총)이 붙어 '완전히' 정맥으로만 영양을 공급","c":4},{"id":124,"a":"NS(N/S)","o":"normal saline","p":"노멀 살린","m":"생리식염수","t":"normal(생리적인 농도)+saline(식염수) → 0.9% 생리식염수","c":4},{"id":157,"a":"q","o":"quaque, every","p":"콰케","m":"매, 마다","t":"quaque=매번이라는 뜻, q가 보이면 무조건 '매~'로 해석 시작","c":5,"sp":1},{"id":158,"a":"q h","o":"quaque hora, every hour","p":"콰케 호라","m":"매시간","t":"q(매)+h(hour, 시간) = 매시간","c":5,"sp":1},{"id":159,"a":"q n","o":"quaque nocte, every night","p":"콰케 녹테","m":"매일 밤마다","t":"q(매)+n(nocte, 밤) = 매일 밤마다","c":5,"sp":1},{"id":160,"a":"q2h","o":"quaque 2 hore","p":"콰케 투 호레","m":"매 2시간마다","t":"q+숫자+h = '숫자시간마다', 숫자만 바꿔서 q4h, q6h로 확장 가능","c":5},{"id":162,"a":"qd","o":"quaque die","p":"콰케 디에","m":"매일","t":"q(매)+d(die, 하루) = 매일","c":5},{"id":182,"a":"sid","o":"semel in die","p":"세멜 인 디에","m":"하루 한번만","t":"semel=한 번(once) → 하루에 딱 1번만 투여","c":5},{"id":198,"a":"tid","o":"ter in die, three times a day","p":"테르 인 디에","m":"하루 세 번","t":"ter=3번(triple과 연결) → 하루 3번 투여 ※ 원본의 three times a day 표기를 함께 실었어요.","c":5,"sp":1},{"id":164,"a":"qid","o":"quarter in die, four times a day","p":"쿼터 인 디에","m":"하루 4번","t":"quarter=4 → 하루 4번(대략 6시간마다) 투여 ※ 원본 표기는 quarter지만 라틴어 표준 철자는 quater예요.","c":5,"alt":["quater in die, four times a day","quater in die"],"sp":1},{"id":153,"a":"prn","o":"pro re nata, when needed","p":"프로 레 나타","m":"필요시마다","t":"'그때그때 상황(re nata)에 따라' → 필요할 때마다 투여","c":5,"sp":1},{"id":191,"a":"stat","o":"statim","p":"스타팀","m":"즉시","t":"응급상황에서 '스탯!' 외치는 장면을 연상하면 '즉시'가 바로 떠오름","c":5},{"id":121,"a":"non rep","o":"non repetatur, do not repeat","p":"논 레페타투르","m":"반복하지 말 것","t":"non(아니다)+repeat(반복) → 한 번만 주고 반복하지 마라","c":5,"sp":1},{"id":186,"a":"SOS","o":"si opus sit","p":"시 오푸스 시트","m":"위급시","t":"구조신호 SOS(도와주세요)를 그대로 연상 → 위급할 때","c":5},{"id":136,"a":"pc","o":"post cibum, after meals","p":"포스트 시붐","m":"식후","t":"post(이후)+cibum(식사) → 식사 후에 복용","c":5,"sp":1},{"id":197,"a":"tab","o":"tabella, tablet","p":"타벨라","m":"정","t":"tablet(정제)의 앞 3글자, 발음도 그대로 '탭'","c":6,"sp":1},{"id":144,"a":"Pil","o":"pilura","p":"필루라","m":"환","t":"pill(알약)과 발음이 비슷 → 둥글게 뭉친 환약 ※ 원본 표기는 pilura지만 라틴어 표준 철자는 pilula(환약)예요.","c":6,"alt":["pilula"]},{"id":156,"a":"pulv","o":"pulvis","p":"풀비스","m":"가루, 산제","t":"pulverize(가루로 만들다)와 어원이 같음","c":6},{"id":206,"a":"ung","o":"unguentum","p":"운구엔툼","m":"연고(ointment)","t":"un~으로 시작하는 끈적한 어감을 연고와 연결해서 암기","c":6},{"id":184,"a":"Sol","o":"solution","p":"솔루션","m":"용액","t":"solution의 앞 3글자, 발음 그대로 '솔'","c":6},{"id":185,"a":"solv","o":"solvent","p":"솔벤트","m":"용해제","t":"Sol(용액)을 만드는 재료가 되는 solv(용해제)로 세트 암기","c":6},{"id":194,"a":"syr","o":"syrup","p":"시럽","m":"시럽","t":"syrup의 앞 3글자, 발음이 표기와 동일","c":6},{"id":201,"a":"Tr or tindt","o":"tinctura, tincture","p":"팅크투라","m":"팅크제","t":"알코올에 약물 성분을 우려낸 제제, '팅크제'라는 발음 그대로 기억","c":6,"sp":1},{"id":189,"a":"ss","o":"semissis, one half","p":"세미시스","m":"반","t":"semi=절반(half) → s를 두 번 써서 술센터","c":1},{"id":1045,"a":"DTR","o":"Deep tendon reflex","p":"딥 텐던 리플렉스","m":"심부건 반사","t":"deep(깊은)+tendon(건)+reflex(반사) → 무릎반사 등 신경계 사정 항목","c":1},{"id":1046,"a":"EDBC","o":"Encourage deep breathing and coughing","p":"인커리지 딥 브리딩 앤 코핑","m":"심호흡과 기침 격려","t":"encourage(격려하다)+deep breathing and coughing(심호흡과 기침) → 수술 후 폐합병증 예방 간호","c":1},{"id":1047,"a":"EDC","o":"Estimated day of confinement","p":"에스티메이티드 데이 오브 컨파인먼트","m":"분만예정일","t":"estimated(예상되는)+day of confinement(출산일) → 출산예정일 ※ 흔히 Estimated date of confinement로도 써요.","c":1,"alt":["estimated date of confinement"]},{"id":1048,"a":"EMR","o":"Electronic medical record","p":"일렉트로닉 메디컬 레코드","m":"전자의무기록","t":"electronic(전자의)+medical record(의무기록) → 종이차트 대신 전자기록","c":1},{"id":1049,"a":"ENBD","o":"Endoscopic naso-biliary drainage","p":"엔도스코픽 나소빌리어리 드레이니지","m":"내시경적 경피적 담즙배출","t":"endoscopic(내시경의)+naso-biliary drainage(코를 통한 담즙배액) → 코로 빼낸 담즙배액관 ※ 원본 뜻은 경피적이지만 naso(코)를 통하므로 정확히는 경비적(코를 통한) 담즙배액이에요.","c":1},{"id":1050,"a":"ENR","o":"electronic nursing record","p":"일렉트로닉 널싱 레코드","m":"전자간호기록","t":"EMR(전자의무기록)의 간호 버전, nursing(간호)만 바뀐 것","c":1},{"id":1051,"a":"FAS","o":"facial analogue scale","p":"페이셜 애널로그 스케일","m":"얼굴통증 척도","t":"facial(얼굴의)+analogue scale(아날로그 척도) → 표정 그림으로 통증을 표현하는 척도","c":1},{"id":1052,"a":"F-cath","o":"indwelling urinary catheterization","p":"인드웰링 유리너리 카테터라이제이션","m":"유치 도뇨","t":"foley catheter의 F, 방광에 '유치'해두는 도뇨관","c":1},{"id":1053,"a":"FHT","o":"Fetal heart tone","p":"피탈 하트 톤","m":"태아심음","t":"fetal(태아의)+heart tone(심음) → 태아의 심장박동 소리","c":1},{"id":1054,"a":"f/u","o":"follow up","p":"팔로우 업","m":"추적관찰","t":"follow up 그대로, 외래에서 경과를 계속 지켜본다는 뜻","c":1},{"id":1055,"a":"FUO","o":"Fever of unknown origin","p":"피버 오브 언노운 오리진","m":"원인불명 열","t":"fever(열)+unknown origin(원인불명) → 원인을 못 찾은 발열","c":1},{"id":1056,"a":"GCS","o":"Glasgow coma scale","p":"글래스고우 코마 스케일","m":"글라스고우 혼수 척도","t":"지명 Glasgow(글래스고)에서 개발된 coma(혼수) 평가 척도, 의식수준 사정에 필수 ※ 원본의 Glasgow(원본 오타 glasogow)를 뜻에 다시 넣었어요.","c":1},{"id":1057,"a":"GFR","o":"glomerular filtration rate","p":"글로메럴러 필트레이션 레이트","m":"사구체 여과율","t":"glomerular(사구체의)+filtration rate(여과율) → 신장기능을 나타내는 대표 수치","c":1},{"id":1058,"a":"HE","o":"Head elevation","p":"헤드 엘리베이션","m":"침상올리기","t":"Head(머리)+elevation(올림) → 침상머리를 올리는 체위","c":1},{"id":1059,"a":"HD","o":"Hospital day / Hemodialysis","p":"하스피털 데이, 헤모다이알러시스","m":"입원일수 / 혈액투석","t":"Hospital day(입원일수)와 Hemodialysis(혈액투석) 두 가지 뜻으로 쓰이니 문맥으로 구분","c":1,"sp":1},{"id":1060,"a":"HTGE","o":"hypertonic glucose enema","p":"하이퍼토닉 글루코스 에니마","m":"고장성 포도당 관장","t":"hypertonic(고장성의)+glucose enema(포도당 관장) → 고장성 포도당 용액으로 하는 관장","c":1},{"id":1061,"a":"I&D","o":"incision and drainage","p":"인시전 앤 드레이니지","m":"절개 및 배농술","t":"incision(절개)+drainage(배액) → 고름을 빼내기 위해 절개 후 배농","c":1},{"id":1062,"a":"I/O","o":"intake / output","p":"인테이크, 아웃풋","m":"섭취 및 배설량","t":"intake(섭취량)+output(배설량) → 체액균형 확인의 기본 지표","c":1},{"id":1063,"a":"IABP","o":"intra-aortic balloon pump","p":"인트라 에이오틱 발룬 펌프","m":"대동맥내 풍선펌프","t":"intra(안으로)+aortic(대동맥의)+balloon pump(풍선펌프) → 심장보조장치","c":1},{"id":1064,"a":"ID/OD","o":"inner diameter / outer diameter","p":"이너 다이어미터, 아우터 다이어미터","m":"내경/ 외경","t":"inner(내부)+outer(외부)+diameter(지름) → 튜브·카테터 굵기 표기 시 사용","c":1},{"id":1065,"a":"IPC","o":"intermittent pneumatic","p":"인터미턴트 뉴매틱","m":"간헐적 압박기구","t":"intermittent(간헐적인)+pneumatic(공기압의) → 혈전예방용 다리 압박기구 ※ 원래 명칭은 intermittent pneumatic compression(간헐적 공기압박)이에요.","c":1,"alt":["intermittent pneumatic compression"]},{"id":1066,"a":"J-P tube","o":"Jackson Pratt tube","p":"잭슨 프랫 튜브","m":"수술 후 분비물 배액관(J-P드레인)","t":"개발자 Jackson과 Pratt의 이름을 딴 배액관, 수술 후 삼출물 배출","c":1},{"id":1067,"a":"KVO","o":"keep vein open","p":"킵 베인 오픈","m":"정맥이 막히지 않게 유지","t":"keep(유지하다)+vein open(정맥을 열어둠) → 최소 속도로 수액을 흘려 혈관 확보","c":1},{"id":1068,"a":"LBP","o":"low back pain","p":"로우 백 페인","m":"요통","t":"low back(허리)+pain(통증) → 허리 통증 그대로","c":1},{"id":1069,"a":"MRSA","o":"methicillin resistant staphylococcus aureus","p":"메티실린 리지스턴트 스타필로코커스 아우레우스","m":"메타실린 내성 포도상구균","t":"methicillin resistant(메티실린 내성)+staphylococcus aureus(황색포도상구균) → 대표적 항생제methicillin resistant(메티실린 내성)+staphylococcus aureus(황색포도상구균) → 대표적 항생제 내성균","c":1},{"id":1070,"a":"nelaton","o":"intermittent urinary catheterization","p":"넬라톤","m":"단순도뇨","t":"개발자 이름 Nélaton에서 유래, F-cath(유치도뇨)와 달리 1회성 단순도뇨","c":1},{"id":1071,"a":"NIBP","o":"Non-invasive blood pressure","p":"넌 인베이시브 블러드 프레셔","m":"비침습적 혈압","t":"non-invasive(비침습적인)+blood pressure(혈압) → 커프로 재는 일반적 혈압측정","c":1},{"id":1072,"a":"NPO","o":"nothing per oral","p":"낫씽 퍼 오럴","m":"금식","t":"nothing(아무것도 없음)+per oral(경구로) → 입으로 아무것도 섭취하지 않음","c":1},{"id":1073,"a":"NRS","o":"numeric scale","p":"뉴메릭 스케일","m":"숫자(통증)척도","t":"numeric(숫자의)+scale(척도) → 0~10 숫자로 통증을 표현하는 척도","c":1},{"id":1074,"a":"O&C","o":"open and closure","p":"오픈 앤 클로저","m":"개방 및 봉합","t":"open(열기)+closure(봉합) → 수술 시 절개와 봉합을 함께 지칭","c":1},{"id":1075,"a":"PD","o":"peritoneal dialysis","p":"페리토니얼 다이알러시스","m":"복막투석","t":"peritoneal(복막의)+dialysis(투석) → 복막을 이용한 투석법","c":1},{"id":1076,"a":"POD","o":"Post operative day","p":"포스트 오퍼러티브 데이","m":"수술후 일수","t":"post operative(수술 후의)+day(일수) → 수술 후 며칠째인지 표시","c":1},{"id":1077,"a":"PR","o":"physical restrain","p":"피지컬 리스트레인","m":"억제대 적용","t":"physical(신체적인)+restrain(억제) → 낙상방지 등을 위한 억제대 적용","c":1},{"id":1078,"a":"PT","o":"physical therapy","p":"피지컬 세러피","m":"물리치료","t":"physical(신체의)+therapy(치료) → 물리치료 그대로","c":1},{"id":1079,"a":"R/O","o":"rule out","p":"룰 아웃","m":"가진단","t":"rule out(배제하다) → 다른 가능성을 배제해가며 좁혀가는 진단 과정","c":1},{"id":1080,"a":"RD/SD/LD","o":"regular diet / soft diet / liquid diet","p":"레귤러, 소프트, 리퀴드 다이어트","m":"밥/ 죽/ 미음","t":"regular(일반)/soft(부드러운)/liquid(액체) → 식사 형태 단계별 분류","c":1},{"id":1081,"a":"ROA","o":"rupture of amniotic","p":"럽처 오브 애니오틱","m":"양막 파열","t":"rupture(파열)+amniotic(양막의) → 양수가 터진 상태(조기양막파열 등)","c":1},{"id":1082,"a":"ROM","o":"range of movement","p":"레인지 오브 무브먼트","m":"운동 범위","t":"range(범위)+movement(움직임) → 관절이 움직일 수 있는 범위","c":1},{"id":1083,"a":"SB-tube","o":"Sengstaken Blakemore tube","p":"셍스테이큰 블레이크모어 튜브","m":"SB튜브","t":"개발자 Sengstaken과 Blakemore의 이름, 식도정맥류 출혈 압박용 튜브","c":1},{"id":1084,"a":"SOB","o":"shortness of breath","p":"숏니스 오브 브레스","m":"짧으면서 빈 호흡","t":"shortness(짧음)+of breath(호흡의) → 숨이 차는 호흡곤란 상태","c":1},{"id":1085,"a":"T/F","o":"time free","p":"타임 프리","m":"시간이 정해져있지 않은","t":"time(시간)+free(자유로운) → 특정 시간에 구애받지 않는다는 뜻","c":1},{"id":1086,"a":"VAS","o":"visual analogue scale","p":"비주얼 애널로그 스케일","m":"시각통증척도","t":"visual(시각적)+analogue scale(아날로그 척도) → 눈금자로 통증 강도 표시","c":1},{"id":1087,"a":"VDRL","o":"Venereal Disease Research Laboratory","p":"비너리얼 디지즈 리서치 래버러토리","m":"매독 선별검사","t":"Venereal Disease(성병)+Research Laboratory(연구실) → 매독 선별검사 명칭","c":1},{"id":1088,"a":"VRE","o":"vancomycin resistant Enterococcus","p":"반코마이신 리지스턴트 엔테로코커스","m":"반코마이신내성 장구균","t":"vancomycin resistant(반코마이신 내성)+Enterococcus(장구균) → MRSA와 비슷한 패턴의 내성균명","c":1},{"id":1089,"a":"WOB","o":"work of breath","p":"워크 오브 브레스","m":"호흡 부담","t":"work(일,부담)+of breath(호흡의) → 숨쉬기 위해 들어가는 노력의 정도","c":1},{"id":1090,"a":"PR","o":"pulse rate","p":"펄스 레이트","m":"맥박수","t":"주의! 바로 앞의 PR(억제대 적용)과 같은 약어, 여기서는 pulse(맥박)+rate(율)로 전혀 다른 뜻","c":1},{"id":1091,"a":"A.A.A.","o":"abdominal aortic aneurysm","p":"앱도미널 에이오틱 애뉴리즘","m":"복부 대동맥류","t":"abdominal(복부의)+aortic aneurysm(대동맥류) → 배 쪽 대동맥이 부풀어 오른 상태 ※ 원본 철자 aneurism도 같은 말이에요(aneurysm이 더 흔한 철자).","c":2,"alt":["abdominal aortic aneurism"]},{"id":1092,"a":"ACA","o":"Anterior Cerebral Artery","p":"앤테리어 세레브럴 아터리","m":"앞쪽 대뇌동맥","t":"anterior(앞쪽)+cerebral artery(대뇌동맥) → MCA·PCA와 함께 뇌동맥 3형제로 암기","c":2},{"id":1093,"a":"AIDS","o":"Acquired Immuno(Immune) Deficiency Syndrome","p":"에이즈","m":"후천성 면역결핍증","t":"이미 익숙한 '에이즈', acquired(후천적)+immune deficiency(면역결핍)","c":2},{"id":1094,"a":"ALL","o":"acute lymphocytic leukemia","p":"어큐트 림포사이틱 류케미아","m":"급성 림프구성 백혈병","t":"acute(급성)+lymphocytic(림프구성)+leukemia(백혈병) → CLL(만성)과 급성/만성으로 짝 암기 ※ 원본에는 lympocytic으로 오타가 있어 바로잡았어요.","c":2},{"id":1095,"a":"AMI","o":"acute myocardial infarction","p":"어큐트 마이오카디얼 인팔션","m":"급성심근경색","t":"acute(급성)+myocardial infarction(심근경색) → 응급 심장질환의 대표 ※ 원본에는 myocardiac으로 적혀 있지만 바른 표기는 myocardial이에요.","c":2},{"id":1096,"a":"AML","o":"acute myelogenous leukemia","p":"어큐트 마이얼라저너스 류케미아","m":"급성 골수성 백혈병","t":"acute(급성)+myelogenous(골수성)+leukemia(백혈병) → CML(만성)과 짝 암기","c":2},{"id":1097,"a":"APN","o":"acute pyelonephritis","p":"어큐트 파이얼로네프라이티스","m":"급성 신우신염","t":"acute(급성)+pyelonephritis(신우신염) → 신장 감염질환","c":2},{"id":1098,"a":"AR","o":"aortic valve regurgitation","p":"에이오틱 밸브 리거저테이션","m":"대동맥판 역류","t":"aortic valve(대동맥판막)+regurgitation(역류) → AS(협착)와 짝지어 암기","c":2},{"id":1099,"a":"ARDS","o":"adult respiratory distress syndrome","p":"애덜트 레스퍼러토리 디스트레스 신드롬","m":"성인 호흡장애 증후군","t":"adult(성인)+respiratory distress(호흡곤란)+syndrome(증후군) → 중증 급성 폐손상","c":2},{"id":1100,"a":"ARF","o":"acute renal failure","p":"어큐트 리널 페일리어","m":"급성 신부전","t":"acute(급성)+renal failure(신부전) → CRF(만성)과 짝 암기","c":2},{"id":1101,"a":"AS","o":"aortic stenosis","p":"에이오틱 스테노시스","m":"대동맥판 협착","t":"aortic(대동맥의)+stenosis(협착) → AR(역류)과 짝지어 암기","c":2},{"id":1102,"a":"ASD","o":"atrial septal defect","p":"에이트리얼 셉털 디펙트","m":"심방중격 결손","t":"atrial(심방의)+septal defect(중격결손) → 선천성 심장질환, VSD(심실중격)와 짝","c":2},{"id":1103,"a":"ASO","o":"Arteriosclerosis obliterans","p":"아테리오스클러로시스 어블리터런스","m":"동맥경화성 폐쇄","t":"Arteriosclerosis(동맥경화)+obliterans(폐쇄성의) → 말초동맥이 막히는 질환","c":2},{"id":1104,"a":"AVN","o":"avascular necrosis","p":"에이배스큘러 네크로시스","m":"무혈성 괴사","t":"avascular(혈액공급이 없는)+necrosis(괴사) → 혈류 차단으로 뼈조직이 죽는 상태","c":2},{"id":1105,"a":"AVR","o":"aortic valve replacement","p":"에이오틱 밸브 리플레이스먼트","m":"대동맥판막치환술","t":"aortic valve(대동맥판막)+replacement(교체) → 판막을 인공판막으로 바꾸는 수술","c":2},{"id":1106,"a":"CAD","o":"coronary artery disease","p":"코로너리 아터리 디지즈","m":"관상동맥질환","t":"coronary artery(관상동맥)+disease(질환) → 심장에 혈액을 공급하는 혈관의 질환","c":2},{"id":1107,"a":"CBD ca","o":"common bile duct ca.","p":"커먼 바일 덕트 카시노마","m":"총 담도암","t":"common bile duct(총담관)+ca(암, carcinoma) → 담즙이 지나가는 관의 암","c":2},{"id":1108,"a":"CGN","o":"chronic glomerulonephritis","p":"크로닉 글로메럴로네프라이티스","m":"만성 사구체염","t":"chronic(만성)+glomerulonephritis(사구체신염) → 신장 사구체의 만성 염증","c":2},{"id":1109,"a":"CHF","o":"chronic heart failure / congestive heart failure","p":"크로닉 하트 페일리어","m":"만성 심부전 / 울혈성 심부전","t":"chronic(만성) 또는 congestive(울혈성)+heart failure(심부전) → 두 표현 모두 같은 약어로 사용","c":2,"sp":1},{"id":1110,"a":"CLL","o":"chronic lymphocytic leukemia","p":"크로닉 림포사이틱 류케미아","m":"만성 림프구성 백혈병","t":"ALL(급성)의 만성 버전, chronic(만성)만 바뀐 것으로 세트 암기","c":2},{"id":1111,"a":"CML","o":"chronic myelogenous leukemia","p":"크로닉 마이얼라저너스 류케미아","m":"만성 골수성 백혈병","t":"AML(급성)의 만성 버전, 백혈병 4종(ALL/AML/CLL/CML) 세트로 암기","c":2},{"id":1112,"a":"COPD","o":"chronic obstructive pulmonary disease","p":"크로닉 옵스트럭티브 펄모너리 디지즈","m":"만성폐쇄성 폐질환","t":"chronic(만성)+obstructive(폐쇄성)+pulmonary disease(폐질환) → 흡연 관련 대표 만성폐질환","c":2},{"id":1113,"a":"CRF","o":"chronic renal failure","p":"크로닉 리널 페일리어","m":"만성 신부전","t":"ARF(급성)의 만성 버전, chronic만 바뀐 것으로 세트 암기","c":2},{"id":1114,"a":"CVA","o":"Cerebro-Vascular Accident","p":"세레브로 배스큘러 액시던트","m":"뇌졸중","t":"cerebro(뇌)+vascular(혈관)+accident(사고) → 뇌혈관 사고=뇌졸중","c":2},{"id":1115,"a":"DI","o":"Drug intoxication","p":"드러그 인톡시케이션","m":"중독","t":"Drug(약물)+intoxication(중독) → 약물중독","c":2},{"id":1116,"a":"DI","o":"diabetes insipidus","p":"다이어비티스 인시피더스","m":"요붕증","t":"주의! 바로 위 DI(약물중독)와 같은 약어지만 전혀 다른 뜻, diabetes(당뇨성 질환군의 하나)지만 당뇨병이주의! 바로 위 DI(약물중독)와 같은 약어지만 전혀 다른 뜻, diabetes(당뇨성 질환군의 하나)지만 당뇨병이 아닌 요붕증 ※ 원본에는 inspidus로 오타가 있어 insipidus로 바로잡았어요.","c":2},{"id":1117,"a":"DKA","o":"diabetic ketoacidosis","p":"다이어베틱 키토애시도시스","m":"당뇨병성 케톤산증","t":"diabetic(당뇨병의)+ketoacidosis(케톤산증) → 당뇨병의 급성 대사 합병증","c":2},{"id":1118,"a":"DT","o":"Tetanus","p":"테터너스","m":"파상풍 혼합 백신","t":"Diphtheria-Tetanus의 줄임으로 흔히 쓰이는 파상풍 관련 혼합백신 표기","c":2},{"id":1119,"a":"EDH","o":"epidural hemorrhage","p":"에피듀럴 헤머리지","m":"경막 외 출혈","t":"epidural(경막외)+hemorrhage(출혈) → 두개골과 경막 사이의 출혈","c":2},{"id":1120,"a":"ESRD","o":"end stage renal disease","p":"엔드 스테이지 리널 디지즈","m":"말기신질환","t":"end stage(말기)+renal disease(신장질환) → 투석/이식이 필요한 신부전 최종단계 ※ 원본에는 end state로 오타가 있어 end stage로 바로잡았어요.","c":2},{"id":1121,"a":"GB ca","o":"gall bladder ca.","p":"골 블래더 카시노마","m":"담낭암","t":"gall bladder(담낭)+ca(암) → 쓸개의 암","c":2},{"id":1122,"a":"HCC","o":"Hepato-Cellular Carcinoma","p":"헤파토셀룰러 카시노마","m":"간세포암","t":"Hepato(간)+Cellular(세포성)+Carcinoma(암종) → 가장 흔한 원발성 간암","c":2},{"id":1123,"a":"HIV","o":"Human Immunodeficiency Virus","p":"휴먼 이뮤노데피션시 바이러스","m":"인간면역결핍성바이러스","t":"human(인간)+immunodeficiency(면역결핍)+virus(바이러스) → AIDS를 일으키는 바이러스","c":2},{"id":1124,"a":"ICH","o":"Intracranial Hemorrhage","p":"인트라크레이니얼 헤머리지","m":"뇌내출혈","t":"intracranial(두개내의)+hemorrhage(출혈) → 뇌 안쪽의 출혈","c":2},{"id":1125,"a":"IHD stone","o":"intrahepatic bile duct stone","p":"인트라헤파틱 바일 덕트 스톤","m":"간내 담도 담석","t":"intrahepatic(간내의)+bile duct stone(담관결석) → 간 속 담관에 생긴 돌","c":2},{"id":1126,"a":"ILD","o":"Interstitial Lung Disease","p":"인터스티셜 렁 디지즈","m":"간질성 폐질환","t":"interstitial(간질의, 조직사이의)+lung disease(폐질환) → 폐조직 사이가 굳는 질환군","c":2},{"id":1127,"a":"IVH","o":"intraventricular hemorrhage","p":"인트라벤트리큘러 헤머리지","m":"뇌실내 출혈","t":"intraventricular(뇌실내의)+hemorrhage(출혈) → 뇌실 안쪽의 출혈","c":2},{"id":1128,"a":"LAD","o":"Left Anterior Descending coronary artery","p":"레프트 앤테리어 디센딩 코로너리 아터리","m":"좌전하행지 관상동맥","t":"Left(좌측)+Anterior Descending(앞으로 내려가는)+coronary artery(관상동맥) → 심근경색에서 가장Left(좌측)+Anterior Descending(앞으로 내려가는)+coronary artery(관상동맥) → 심근경색에서 가장 중요한 혈관","c":2},{"id":1129,"a":"LVH","o":"left ventricular hypertrophy","p":"레프트 벤트리큘러 하이퍼트로피","m":"좌심실 비대","t":"left ventricular(좌심실)+hypertrophy(비대) → 고혈압 등으로 좌심실이 두꺼워진 상태","c":2},{"id":1130,"a":"L/C","o":"liver cirrhosis","p":"리버 시로시스","m":"간경화","t":"liver(간)+cirrhosis(경화) → 간이 딱딱하게 굳는 질환","c":2},{"id":1131,"a":"MCA","o":"Middle Cerebral Artery","p":"미들 세레브럴 아터리","m":"중간대뇌동맥","t":"Middle(중간)+cerebral artery(대뇌동맥) → ACA·PCA와 뇌동맥 3형제로 암기","c":2},{"id":1132,"a":"MI","o":"myocardial infarction","p":"마이오카디얼 인팔션","m":"심근경색증","t":"myocardial(심근의)+infarction(경색) → AMI(급성)의 기본형 ※ 원본에는 myocardiac으로 적혀 있지만 바른 표기는 myocardial이에요.","c":2},{"id":1133,"a":"MR","o":"Mitral Regurgitation","p":"마이트럴 리거저테이션","m":"이첨판 역류","t":"Mitral(이첨판)+Regurgitation(역류) → MS(협착)와 짝지어 암기","c":2},{"id":1134,"a":"MR","o":"Mental Retardation","p":"멘탈 리타데이션","m":"정신지체","t":"주의! 바로 위 MR(이첨판 역류)과 같은 약어지만 전혀 다른 뜻, Mental(정신의)+Retardation(지체)","c":2},{"id":1135,"a":"MS","o":"Mitral Stenosis","p":"마이트럴 스테노시스","m":"이첨판 협착","t":"Mitral(이첨판)+Stenosis(협착) → MR(역류)과 짝지어 암기","c":2},{"id":1136,"a":"MS","o":"Multiple Sclerosis","p":"멀티플 스클러로시스","m":"다발성 경화증","t":"주의! 바로 위 MS(이첨판협착)와 같은 약어지만 전혀 다른 뜻, Multiple(다발성)+Sclerosis(경화증, 신경계주의! 바로 위 MS(이첨판협착)와 같은 약어지만 전혀 다른 뜻, Multiple(다발성)+Sclerosis(경화증, 신경계 질환)","c":2},{"id":1137,"a":"PCA","o":"Posterior Cerebral Artery","p":"포스테리어 세레브럴 아터리","m":"뒤쪽 대뇌동맥","t":"Posterior(뒤쪽)+cerebral artery(대뇌동맥) → ACA·MCA와 함께 뇌동맥 3형제로 암기","c":2},{"id":1138,"a":"RCA","o":"Right Coronary Artery","p":"라이트 코로너리 아터리","m":"우관상동맥","t":"Right(우측)+coronary artery(관상동맥) → LAD와 함께 심장 혈관 암기","c":2},{"id":1139,"a":"RVH","o":"right ventricular hypertrophy","p":"라이트 벤트리큘러 하이퍼트로피","m":"우심실 비대","t":"right ventricular(우심실)+hypertrophy(비대) → LVH(좌심실비대)와 짝지어 암기","c":2},{"id":1140,"a":"SAH","o":"Sub-Arachnoid Hemorrhage","p":"서브 어래크노이드 헤머리지","m":"지주막하출혈","t":"Sub(아래)+Arachnoid(지주막)+Hemorrhage(출혈) → 뇌를 감싸는 지주막 아래 출혈","c":2},{"id":1141,"a":"SDH","o":"Sub-Dural Hemorrhage","p":"서브 듀럴 헤머리지","m":"경뇌막하출혈(경막하출혈)","t":"Sub(아래)+Dural(경막의)+Hemorrhage(출혈) → EDH(경막외출혈)와 위치로 구분해서 암기","c":2},{"id":1142,"a":"SLE","o":"systemic lupus erythematosus","p":"시스테믹 루퍼스 에리씨마토서스","m":"전신성 홍반성 낭창","t":"systemic(전신성)+lupus erythematosus(홍반성 낭창) → 대표적 자가면역질환","c":2},{"id":1143,"a":"TA","o":"traffic accident","p":"트래픽 액시던트","m":"교통사고","t":"traffic(교통)+accident(사고) → 그대로 직역","c":2},{"id":1144,"a":"TR","o":"Tricuspid Regurgitation","p":"트라이커스피드 리거저테이션","m":"삼첨판 역류","t":"Tricuspid(삼첨판)+Regurgitation(역류) → TS(협착)와 짝지어 암기","c":2},{"id":1145,"a":"TS","o":"Tricuspid Stenosis","p":"트라이커스피드 스테노시스","m":"삼첨판 협착","t":"Tricuspid(삼첨판)+Stenosis(협착) → TR(역류)과 짝지어 암기","c":2},{"id":1146,"a":"VSD","o":"ventricular septal defect","p":"벤트리큘러 셉털 디펙트","m":"심실중격 결손","t":"ventricular(심실의)+septal defect(중격결손) → ASD(심방중격)와 짝지어 암기","c":2},{"id":1147,"a":"C.C","o":"chief complaint","p":"치프 컴플레인트","m":"주호소","t":"Chief(주된)+Complaint(불편감) → 환자가 가장 먼저 호소하는 증상","c":3},{"id":1148,"a":"Ex","o":"Examine","p":"이그잼","m":"검진","t":"Examine의 줄임, '검사하다, 진찰하다'는 뜻","c":3},{"id":1149,"a":"Dx","o":"dressing / Diagnosis","p":"드레싱, 다이어그노시스","m":"소독 /진단","t":"문맥에 따라 dressing(소독)과 diagnosis(진단) 두 가지로 쓰이니 주의","c":3,"sp":1},{"id":1150,"a":"Tx","o":"treatment","p":"트리트먼트","m":"치료","t":"Sx(증상)-Dx(진단)-Tx(치료) 세트로 함께 암기","c":3},{"id":1151,"a":"P.I.","o":"present illness","p":"프레즌트 일니스","m":"현병력","t":"present(현재의)+illness(질병) → 지금 앓고 있는 병의 경과","c":3},{"id":1152,"a":"Hx","o":"history","p":"히스토리","m":"병력","t":"history의 h+x, F/Hx·P/Hx·S/Hx 등 다양한 병력 용어의 기본형","c":3},{"id":1153,"a":"HBP/ HTN","o":"High Blood Pressure / Hypertension","p":"하이 블러드 프레셔, 하이퍼텐션","m":"고혈압","t":"High blood pressure(높은 혈압) 또는 Hypertension(고혈압)의 줄임, 같은 뜻 두 표기","c":3,"sp":1},{"id":1154,"a":"DM","o":"Diabetes Mellitus","p":"다이어비티스 멜리터스","m":"당뇨","t":"Diabetes Mellitus의 약자, 가장 흔히 쓰는 당뇨병 약어","c":3},{"id":1155,"a":"F/Hx","o":"family history","p":"패밀리 히스토리","m":"가족력","t":"family(가족)+history(병력) → 가족 중 질병 이력","c":3},{"id":1156,"a":"P/Hx","o":"past history","p":"패스트 히스토리","m":"과거력","t":"past(과거)+history(병력) → 환자 본인의 과거 질병 이력","c":3},{"id":1157,"a":"S/Hx","o":"social history","p":"소셜 히스토리","m":"사회력","t":"social(사회적인)+history(병력) → 흡연,음주,직업 등 사회적 배경","c":3},{"id":1158,"a":"P/E","o":"physical examination","p":"피지컬 이그재미네이션","m":"신체검진","t":"physical(신체의)+examination(검진) → 신체를 직접 진찰하는 것","c":3},{"id":1159,"a":"G/A","o":"general appearance","p":"제너럴 어피어런스","m":"일반모습","t":"general(전반적인)+appearance(외양) → 환자의 전반적인 겉모습 사정","c":3},{"id":1160,"a":"CNS","o":"central nervous system","p":"센트럴 너버스 시스템","m":"중추신경계","t":"Central(중추의)+Nervous System(신경계) → 뇌와 척수","c":3},{"id":1161,"a":"HEENT","o":"head, ears, eyes, nose, and throat","p":"헤드, 이어즈, 아이즈, 노즈, 스로트","m":"두부/귀/눈/코/인후","t":"head+ears+eyes+nose+throat의 앞글자를 딴 신체사정 범위","c":3},{"id":1162,"a":"MS","o":"mental status","p":"멘탈 스테이터스","m":"의식상태","t":"주의! 질환명 섹션의 MS(이첨판협착/다발성경화증)와 또 다른 뜻, 여기서는 mental(정신의)+status(상태)","c":3},{"id":1163,"a":"GCS","o":"Glasgow coma scale","p":"글래스고우 코마 스케일","m":"글라스고우 혼수 척도","t":"앞 섹션의 GCS(혼수척도)와 동일, 의식수준 평가의 표준 척도","c":3},{"id":1164,"a":"M/F","o":"mental function","p":"멘탈 펑션","m":"정신기능","t":"mental(정신의)+function(기능) → 인지·판단 등 정신 기능 사정","c":3},{"id":1165,"a":"LOC","o":"level of consciousness","p":"레벨 오브 컨셔스니스","m":"의식수준","t":"level(수준)+of consciousness(의식의) → 명료/기면/혼미 등 의식 단계","c":3},{"id":1166,"a":"PLR","o":"pupillary light reflex","p":"퓨필러리 라이트 리플렉스","m":"대광반사","t":"pupillary(동공의)+light reflex(빛반사) → 빛에 대한 동공의 반응 확인","c":3},{"id":1167,"a":"F/C","o":"fever / chill","p":"피버, 칠","m":"발열/오한","t":"fever(열)+chill(오한) → 감염 시 흔한 두 증상 조합","c":3},{"id":1168,"a":"C/S/R","o":"cough/ sputum / rhinorrhea","p":"코프, 스퓨텀, 라이노리아","m":"기침/객담/콧물","t":"cough(기침)+sputum(가래)+rhinorrhea(콧물) → 호흡기 증상 세트","c":3},{"id":1169,"a":"PNS","o":"Peripheral Nervous System","p":"퍼리퍼럴 너버스 시스템","m":"말초신경계","t":"Peripheral(말초의)+Nervous System(신경계) → CNS(중추신경계)와 짝지어 암기","c":3},{"id":1170,"a":"RHB s m̄","o":"regular heart beat without murmur","p":"레귤러 하트 비트 위다웃 머머","m":"심잡음이 없는 정상 심박동","t":"regular heart beat(규칙적 심박동)+s(without, ̄없이)+murmur(잡음) → 's'̄는 '없이'를 뜻하는 기호","c":3},{"id":1171,"a":"CBS s r̄","o":"clear breathing sounds without rale","p":"클리어 브리딩 사운즈 위다웃 레일","m":"맑은 호흡음(수포음 없는)","t":"clear breathing sounds(맑은 호흡음)+s(without)+rale(̄수포음) → 정상 호흡음 기록 표현","c":3},{"id":1172,"a":"G-I","o":"gastro-intestine","p":"가스트로 인테스틴","m":"위장계","t":"gastro(위)+intestine(장) → 위와 장을 합친 소화기계","c":3},{"id":1173,"a":"N/A/V/D/C","o":"nausea / anorexia / vomiting / diarrhea / constipation","p":"너지아, 애노렉시아, 보미팅, 다이어리아, 컨스티페이션","m":"오심/식욕부진/구토/설사/변비","t":"소화기 증상 5가지의 앞글자 조합, 순서대로 나열하며 암기","c":3},{"id":1174,"a":"NABS","o":"normal active bowel sounds","p":"노멀 액티브 바울 사운즈","m":"장음 정상","t":"normal(정상)+active(활발한)+bowel sounds(장음) → 청진 시 정상 장음 확인     if (done) root.appendChild(el("button", { class: "btn primary", id: "exnext", type: "button", style: "width:100%", text: es.i + 1 >= es.q.length ? "결과 보기" : "다음 문제", onclick: examNext }));
    root.appendChild(el("div", { style: "text-align:center;margin-top:10px" }, [el("button", { class: "btn ghost", type: "button", text: "시험 그만두기", onclick: function () { es = null; V.exam(); } })]));
    if (done) { var nb = $("#exnext"); if (nb && !mc) nb.focus({ preventScroll: true }); }
  }
  function examPick(idx) { if (!es || es.picked >= 0) return; var q = es.q[es.i], good = idx === q.ans; es.picked = idx; if (good) es.score++; else es.wrong.push(q.id); apply(q.id, "mc", good); V.exam(); }
  function examSubmit() { if (!String(es.val || "").trim()) { var f = $("#exanso"); if (f) f.focus(); return; } examWFinish(false); }
  function examWFinish(giveUp) { var id = es.q[es.i].id, r = dictJudge(BYID[id], es, "exam", giveUp); es.res = r; es.state = r.cls === "k" ? "ok" : "no"; if (r.cls === "k") es.score++; else es.wrong.push(id); apply(id, "dictr", r.cls); V.exam(); }
  function examNext() { es.i++; es.picked = -1; es.state = "ask"; es.hint = false; es.val = ""; es.mval = ""; es.res = null; es.note = ""; V.exam(); window.scrollTo(0, 0); }
  function examSummary(root) {
    var n = es.q.length, uniq = es.wrong.filter(function (x, i, a) { return a.indexOf(x) === i; });
    if (!es.saved) { es.saved = histAdd(); }
    var prev = histList().filter(function (r) { return r.id !== es.saved.id && r.label === es.saved.label && r.type === es.saved.type; })[0];
    var box = el("div", { class: "summary" }, [el("h2", { text: "시험 결과" }), el("div", { class: "score", text: es.score + " / " + n }), el("div", { class: "count", text: "정답률 " + Math.round(es.score / n * 100) + "%" })]);
    var diff = prev ? pct(es.saved) - pct(prev) : null;
    box.appendChild(el("div", { class: "cmp " + (diff == null ? "" : diff > 0 ? "up" : diff < 0 ? "down" : ""), text: diff == null ? "이 범위의 첫 기록이에요. 시험 기록에 저장했어요." : "같은 범위 지난 기록(" + fmtT(prev.t) + " · " + pct(prev) + "%)보다 " + (diff > 0 ? "+" + diff + "%p 올랐어요" : diff < 0 ? diff + "%p 내려갔어요" : "같아요") }));
    var hu = es.hints.slice(), hb = el("div", { class: "hint-sum" }, [el("b", { text: "힌트 사용 총 " + hu.length + "회" })]);
    if (hu.length) hu.forEach(function (id) { var w = BYID[id], miss = es.wrong.indexOf(id) >= 0; hb.appendChild(el("div", { text: "· " + w.a + " — " + w.m + " (" + DECK_OF[id].short + ")" + (miss ? " · 틀림" : " · 맞힘") })); });
    else hb.appendChild(el("div", { text: "힌트 없이 풀었어요." }));
    box.appendChild(hb);
    if (uniq.length) { var wl = el("div", { class: "wrong-list" }); uniq.forEach(function (id) { var w = BYID[id]; wl.appendChild(el("div", { class: "w" }, [el("span", { class: "a", text: w.a }), el("div", { class: "m", text: w.o + " · " + w.m + " (" + DECK_OF[id].short + ")" })])); }); box.appendChild(wl); }
    var cfg = es.cfg;
    box.appendChild(el("div", { class: "actions" }, [
      uniq.length ? el("button", { class: "btn primary", type: "button", text: "틀린 것만 다시 (" + uniq.length + ")", onclick: function () { exStart(uniq, Object.assign({}, cfg, { n: 0 }), true); V.exam(); window.scrollTo(0, 0); } }) : null,
      el("button", { class: "btn", type: "button", text: "같은 범위로 새 시험", onclick: function () { var ids = exPool(cfg); if (!ids.length) { es = null; V.exam(); return; } exStart(ids, cfg); V.exam(); window.scrollTo(0, 0); } }),
      el("button", { class: "btn ghost", type: "button", text: "범위 다시 고르기", onclick: function () { es = null; V.exam(); } })]));
    root.appendChild(box);
  }
  V.exam = function () {
    var root = $("#v-exam"); root.innerHTML = "";
    if (es) { if (es.i >= es.q.length) examSummary(root); else examRun(root); return; }
    examSetup(root);
  };

  /* ---------- tabs / routing ---------- */
  var TABS = ["decks", "cards", "quiz", "write", "list", "exam"];
  function show(tab) {
    if (TABS.indexOf(tab) < 0) tab = "cards";
    if (tab !== "list" && pl.on) plStop(); S.ui.tab = tab; save();
    TABS.forEach(function (t) { $("#v-" + t).hidden = t !== tab; });
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    V[tab]();
    window.scrollTo(0, 0);
  }
  document.getElementById("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (!b) return; if (location.hash.slice(1) === b.dataset.tab) show(b.dataset.tab); else location.hash = b.dataset.tab; });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  document.addEventListener("keydown", function (e) {
    var t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
    var tab = S.ui.tab;
    if (tab === "cards" && cs && cs.i < cs.q.length) { if (e.key === " " || e.key === "Enter") { if (t && t.tagName === "BUTTON") return; e.preventDefault(); $(".card").click(); } else if (cs.flipped && "123".indexOf(e.key) >= 0 && e.key) cardMark(["k", "u", "x"][+e.key - 1]); }
    else if (tab === "exam" && es && es.i < es.q.length && es.q[es.i].t === "mc" && es.picked < 0 && "1234".indexOf(e.key) >= 0 && e.key) examPick(+e.key - 1);
    else if (tab === "quiz" && qs && qs.i < qs.q.length) { if (qs.picked < 0 && "1234".indexOf(e.key) >= 0 && e.key) quizPick(+e.key - 1); else if (qs.picked >= 0 && e.key === "Enter") { if (t && t.tagName === "BUTTON") return; qs.i++; qs.picked = -1; V.quiz(); } }
  });

  window.KN = { S: S, save: save, refresh: function () { renderCounts(); var tb = S.ui.tab; if (V[tb] && tb !== "write" && tb !== "exam") V[tb](); } };
  document.getElementById("brand").addEventListener("click", function () { go("decks"); });
  renderCounts();
  var h = location.hash.slice(1);
  show(TABS.indexOf(h) >= 0 ? h : (TABS.indexOf(S.ui.tab) >= 0 ? S.ui.tab : "decks"));
})();
</script>
